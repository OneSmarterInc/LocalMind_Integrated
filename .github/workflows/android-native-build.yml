name: Build LocalMind Native Android

on:
  push:
    branches:
      - android-native-build-20260903
    paths:
      - .android-native-trigger
      - .github/workflows/android-native-build.yml
  pull_request:
    branches:
      - main
    paths:
      - .android-native-trigger
      - .android-native-payload/**
      - .github/workflows/android-native-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          cat .android-native-payload/part*.b64 > /tmp/android-native-source.b64
          base64 --decode /tmp/android-native-source.b64 > /tmp/android-native-source.tar.xz
          echo "51a9382e9101d4fb8fddfa08f9402282c0c7271f599fe38e19df1822f403addb  /tmp/android-native-source.tar.xz" | sha256sum --check
          rm -rf android-native
          tar -xJf /tmp/android-native-source.tar.xz
          test -f android-native/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Generate Gradle wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.6

      - name: Unit tests and debug APK
        working-directory: android-native
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug

      - name: Verify and fingerprint APK
        shell: bash
        run: |
          test -s android-native/app/build/outputs/apk/debug/app-debug.apk
          cp android-native/app/build/outputs/apk/debug/app-debug.apk LocalMind-Native-debug.apk
          unzip -tq LocalMind-Native-debug.apk
          sha256sum LocalMind-Native-debug.apk | tee android-native-apk.sha256

      - name: Package Android Studio project
        shell: bash
        run: |
          rm -rf android-native/.gradle android-native/app/build android-native/build
          zip -qr LocalMind-Native-AndroidStudio.zip android-native
          unzip -tq LocalMind-Native-AndroidStudio.zip
          sha256sum LocalMind-Native-AndroidStudio.zip | tee android-native-project.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalMind-Native-build
          if-no-files-found: error
          retention-days: 7
          path: |
            LocalMind-Native-debug.apk
            LocalMind-Native-AndroidStudio.zip
            android-native-apk.sha256
            android-native-project.sha256
